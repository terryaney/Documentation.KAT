<script>
	// Before the stylesheets paint, so a reader on the light theme never sees a dark flash.
	(function () {
		var theme = null;
		try { theme = localStorage.getItem('kcc-docs-theme'); } catch (e) { }
		if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
		document.documentElement.setAttribute('data-theme', theme);
	})();
</script>
